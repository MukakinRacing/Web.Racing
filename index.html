<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Web Racing</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,sans-serif;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{display:block;position:fixed;inset:0}
#hud{position:fixed;left:calc(16px + env(safe-area-inset-left));top:calc(10px + env(safe-area-inset-top));text-shadow:0 1px 4px #000;pointer-events:none}
#spd{font-size:60px;font-weight:700;line-height:1}#spd small{font-size:20px}
#rpm{width:230px;height:8px;background:#0007;margin:6px 0}#rpmb{height:100%;width:0;background:#4fd}
#gear,#lap{font-size:18px;white-space:pre;line-height:1.4}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000d;font-size:20px;text-align:center;padding:24px;white-space:pre-wrap;z-index:9}
button{font:inherit;color:#fff;border:2px solid #fff8;background:#fff3;-webkit-tap-highlight-color:transparent;touch-action:none}
button.on{background:#fffb;color:#000}
.b{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));width:120px;height:120px;border-radius:26px;font-size:30px;font-weight:700}
#bL{left:calc(20px + env(safe-area-inset-left))}#bR{left:calc(156px + env(safe-area-inset-left))}
#bG{right:calc(20px + env(safe-area-inset-right));height:170px;background:#2a8a4a99}
#bB{right:calc(156px + env(safe-area-inset-right));background:#c0303099}
#tools{position:fixed;right:calc(14px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));display:flex;gap:8px}
#tools button{padding:8px 12px;border-radius:12px;font-size:15px}
#swh{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translateX(-50%);text-align:center;pointer-events:none;text-shadow:0 1px 4px #000;font-size:15px}
#swi{width:50px;height:50px;box-sizing:border-box;border:6px solid #fffd;border-radius:50%;margin:0 auto 2px;position:relative;background:#0003}
#swi:before{content:"";position:absolute;left:0;right:0;top:50%;height:6px;margin-top:-3px;background:#fffd}
#swi:after{content:"";position:absolute;left:50%;top:50%;bottom:0;width:6px;margin-left:-3px;background:#fffd}
#swi i{position:absolute;left:50%;top:-6px;width:6px;height:6px;margin-left:-3px;background:#f44}
#bH{left:50%;transform:translateX(-50%);width:96px;height:52px;border-radius:16px;font-size:14px;background:#fff2;opacity:.85}
#panel{display:none;position:fixed;right:calc(14px + env(safe-area-inset-right));top:calc(58px + env(safe-area-inset-top));background:#000b;border:1px solid #fff5;border-radius:14px;padding:8px 16px;z-index:5;touch-action:manipulation}
#panel label{display:block;font-size:17px;padding:8px 0;white-space:nowrap}
#panel input{width:22px;height:22px;vertical-align:middle;margin:0 10px 0 0}
</style>
</head>
<body>
<div id="hud"><div id="spd">0<small> km/h</small></div><div id="rpm"><div id="rpmb"></div></div><div id="gear">GEAR 1</div><div id="lap"></div></div>
<div id="swh"><div id="swi"><i></i></div><div id="swd">0°</div></div>
<div id="tools"><button id="bAs">⚙ アシスト</button><button id="bReset">RESET</button></div>
<div id="panel">
<label><input type="checkbox" id="aTC" checked>TCS(トラクションコントロール)</label>
<label><input type="checkbox" id="aABS" checked>ABS</label>
<label><input type="checkbox" id="aSTA" checked>ステア補正</label>
<label><input type="checkbox" id="aESC">横滑り防止(ESC)</label>
</div>
<button class="b" id="bL">◀</button><button class="b" id="bR">▶</button>
<button class="b" id="bB">BRAKE</button><button class="b" id="bG">GAS</button><button class="b" id="bH">サイド</button>
<div id="msg">読み込み中…</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script>
// iPadの拡大(ダブルタップ・ピンチ)を無効にする
(function () {
  var last = 0, opt = { passive: false };
  document.addEventListener('touchend', function (e) { var n = Date.now(); if (n - last < 350) e.preventDefault(); last = n; }, opt);
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) { document.addEventListener(t, function (e) { e.preventDefault(); }, opt); });
  document.addEventListener('touchmove', function (e) { if (e.scale && e.scale !== 1) e.preventDefault(); }, opt);
  document.addEventListener('dblclick', function (e) { e.preventDefault(); });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
})();
</script>
<script type="module" src="main.js"></script>
<script>
// main.js が動き出さなかった場合(通信エラーやiPadOSが古い等)の案内
setTimeout(function () {
  if (!window.__ok) document.getElementById('msg').textContent = '起動に失敗しました。\n通信状況を確認し、iPadOSが16.4以上か確認してください。\n(main.js / physics.js が同じ場所にあるかも確認)';
}, 8000);
</script>
</body>
</html>
